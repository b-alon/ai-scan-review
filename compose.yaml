services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scan -d scan"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dbdata:
